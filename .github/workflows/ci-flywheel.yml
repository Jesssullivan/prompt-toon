name: Flywheel Executor

# TIN-2704: required-ready Linux validation on the pooled GloriousFlywheel
# substrate. This workflow remains variable-gated until the repo-scoped ARC
# registration anchor and GF consumer row are live. Branch protection moves
# only after one counted executor proof passes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Immutable GF source for the profile tools and authoritative process parser.
  GF_CORE_REV: d0c244319f496f8f35ea12741a2168b7a0dab4cc

jobs:
  executor:
    name: Flywheel executor-backed validation
    if: >-
      vars.FLYWHEEL_EXECUTOR_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      id-token: write
    runs-on: tinyland-nix
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install pinned GloriousFlywheel profile tools
        id: gf
        run: |
          set -euo pipefail
          ref="github:tinyland-inc/GloriousFlywheel/${GF_CORE_REV}"
          tools="$(nix --option access-tokens "" build --no-link --print-out-paths "${ref}#gloriousflywheel-profile-tools")"
          source_path="$(nix --option access-tokens "" eval --raw --impure --expr "(builtins.getFlake \"${ref}\").outPath")"
          for tool in flywheel-github-oidc-profile gf-reapi-credhelper flywheel-verify gloriousflywheel-bazel; do
            test -x "${tools}/bin/${tool}" || {
              echo "::error::${tool} missing from pinned GF profile tools"
              exit 1
            }
          done
          echo "bin=${tools}/bin" >> "${GITHUB_OUTPUT}"
          echo "source=${source_path}" >> "${GITHUB_OUTPUT}"

      - name: Require the in-cluster executor front door
        run: |
          set -euo pipefail
          test -n "${BAZEL_REMOTE_EXECUTOR:-}" || {
            echo "::error::BAZEL_REMOTE_EXECUTOR is missing from the ARC profile"
            exit 1
          }
          test -n "${GF_REAPI_TOKEN_EXCHANGE_ENDPOINT:-}" || {
            echo "::error::GF_REAPI_TOKEN_EXCHANGE_ENDPOINT is missing from the ARC profile"
            exit 1
          }

      - name: Mint short-lived GF executor profile
        id: mint
        env:
          GF_REAPI_TOKEN_EXCHANGE_TTL: 45m
        run: |
          set -euo pipefail
          "${{ steps.gf.outputs.bin }}/flywheel-github-oidc-profile" --endpoint "${GF_REAPI_TOKEN_EXCHANGE_ENDPOINT}" --request executor --ttl "${GF_REAPI_TOKEN_EXCHANGE_TTL}" --frontdoor-endpoint "${BAZEL_REMOTE_EXECUTOR}" --credential-helper-bin "${{ steps.gf.outputs.bin }}/gf-reapi-credhelper" --renew-background --renew-log "${RUNNER_TEMP}/gf-reapi-token-renewer.log" --github-output "${GITHUB_OUTPUT}"

      - name: Validate profile and force remote execution
        id: proof
        run: |
          set -euo pipefail
          source "${{ steps.mint.outputs.profile_file }}"
          export PATH="${{ steps.gf.outputs.bin }}:${PATH}"
          "${{ steps.gf.outputs.bin }}/flywheel-verify"
          log="${RUNNER_TEMP}/prompt-toon-rbe.log"
          nix develop --command just flywheel-executor-proof "${log}"
          echo "log=${log}" >> "${GITHUB_OUTPUT}"

      - name: Require counted remote processes
        env:
          GF_SOURCE: ${{ steps.gf.outputs.source }}
          PROOF_LOG: ${{ steps.proof.outputs.log }}
        run: |
          set -euo pipefail
          nix develop --command python3 - "${GF_SOURCE}/scripts/gf-reapi-proof-result.py" "${PROOF_LOG}" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          parser_path, log_path = map(Path, sys.argv[1:3])
          spec = importlib.util.spec_from_file_location("gf_reapi_proof_result", parser_path)
          if spec is None or spec.loader is None:
              raise SystemExit(f"cannot load GF proof parser: {parser_path}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          process_line, counts = module.parse_process_counts(
              log_path.read_text(encoding="utf-8")
          )
          print(process_line)
          print(f"GF remote processes: {counts['remote_processes']}")
          if counts["remote_processes"] <= 0:
              raise SystemExit("executor proof did not record any remote processes")
          PY
