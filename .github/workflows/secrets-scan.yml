name: Secrets Scan

# M0 scaffold (TIN-1307 pattern): gitleaks surfaces as its own required check.
# Runs through the Nix devshell so CI == local (`just secrets-scan` degrades
# only when gitleaks is absent from PATH; inside the devshell it is pinned).
# The required scan runs on the fleet-managed GF ARC substrate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (Nix devshell)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Secrets scan (gitleaks, from the devshell)
        run: nix develop --command just secrets-scan
