name: Darwin Definition

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/native-darwin.yml"
      - "c_src/**"
      - "flake.lock"
      - "flake.nix"
      - "packaging/manifest.json"
      - "prompt_toon/**"
      - "src/ptoon/**"
      - "tools/one_shot_count_matrix.py"
      - "tools/service_parity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ptoon-derivation:
    name: Evaluate aarch64-darwin ptoon derivation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tinyland-nix
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Instantiate without realizing the Darwin artifact
        run: |
          set -euo pipefail
          drv_path="$(nix eval --raw .#packages.aarch64-darwin.ptoon.drvPath)"
          case "$drv_path" in
            /nix/store/*.drv) ;;
            *) echo "::error::unexpected Darwin derivation path: $drv_path"; exit 1 ;;
          esac
          printf 'Darwin derivation: %s\n' "$drv_path"
