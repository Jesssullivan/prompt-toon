[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-toon"
# Version SSOT is prompt_toon/__init__.py:__version__ (TIN-2706 packaging
# manifest derives from it; a release bump edits that ONE string).
dynamic = ["version"]
description = "Local agent research condenser with provenance-preserving prompt minimization and measured TOON support"
requires-python = ">=3.11"

[project.scripts]
prompt-toon = "prompt_toon.cli:main"

[tool.setuptools]
# Explicit discovery: the repo also carries the Chapel tree under src/,
# which setuptools' auto-discovery misreads as a src-layout python package
# (breaking pip/pipx install outright). Only prompt_toon ships as python.
packages = ["prompt_toon"]

[tool.setuptools.data-files]
"share/prompt-toon/policy" = ["policy/delegation.json", "policy/io.json"]

[tool.setuptools.dynamic]
version = {attr = "prompt_toon.__version__"}
